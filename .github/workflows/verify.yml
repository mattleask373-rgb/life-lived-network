name: Verify

on:
  push:
  pull_request:

# Keep only the newest verification run for a given source branch/repository.
# This prevents rapid agent commits from leaving obsolete test runs consuming
# runners while preserving full lint, test, and build gates on the latest commit.
concurrency:
  group: verify-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# The workflow only checks out code and runs local commands; it needs no write token.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject tracked environment files
        shell: bash
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\\.)' | grep -vE '(^|/)\.env\.example
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Set up k6 for load-test script validation
        if: ${{ hashFiles('tests/load/staging-public-read.js') != '' }}
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: "2.3.0"

      - name: Parse k6 script without sending traffic
        if: ${{ hashFiles('tests/load/staging-public-read.js') != '' }}
        env:
          # k6 inspect doesn't reliably apply its --env flags to top-level script initialization.
          # Use process environment variables so the guard sees an inert, non-routable target.
          LOAD_TEST_ENV: staging
          LOAD_TEST_BASE_URL: https://preview.staging.example.invalid
          LOAD_TEST_APPROVED: YES_I_APPROVE_STAGING_LOAD
        run: k6 inspect --execution-requirements tests/load/staging-public-read.js
 || true)"
          if [ -n "$tracked_env_files" ]; then
            printf '::error::Refusing tracked environment files. Keep real values in secret storage, not Git.\n'
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Set up k6 for load-test script validation
        if: ${{ hashFiles('tests/load/staging-public-read.js') != '' }}
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: "2.3.0"

      - name: Parse k6 script without sending traffic
        if: ${{ hashFiles('tests/load/staging-public-read.js') != '' }}
        env:
          # k6 inspect doesn't reliably apply its --env flags to top-level script initialization.
          # Use process environment variables so the guard sees an inert, non-routable target.
          LOAD_TEST_ENV: staging
          LOAD_TEST_BASE_URL: https://preview.staging.example.invalid
          LOAD_TEST_APPROVED: YES_I_APPROVE_STAGING_LOAD
        run: k6 inspect --execution-requirements tests/load/staging-public-read.js
