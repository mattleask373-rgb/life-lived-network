name: Verify

on:
  push:
  pull_request:

# Keep only the newest verification run for a given source branch/repository.
# This prevents rapid agent commits from leaving obsolete test runs consuming
# runners while preserving full lint, test, and build gates on the latest commit.
concurrency:
  group: verify-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# The workflow only checks out code and runs local commands; it needs no write token.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Reject tracked environment files
        run: bash scripts/check-tracked-env-files.sh

      - run: bun install --frozen-lockfile

      # The exact `verify` status is required by the main ruleset. Run the
      # audit first for quick feedback, but do not skip independent tests/build/
      # disposable migration checks just because an advisory is present. The
      # final gate below still fails this required check unless the audit passed.
      - name: Audit locked dependencies (high and critical)
        id: dependency-audit
        continue-on-error: true
        run: bun audit --audit-level=high
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Detect database migration changes
        id: migration-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Base commit unavailable; conservatively running migration replay."
            exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" -- supabase/migrations supabase/config.toml supabase/tests scripts/test-local-discovery-postgrest.mjs | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Database migration/config/test inputs changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No database migration/config/test input changes detected."
          fi

      - name: Set up Supabase CLI for local migration replay
        if: ${{ steps.migration-changes.outputs.changed == 'true' }}
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: "2.84.2"

      - name: Start an isolated local Supabase stack
        if: ${{ steps.migration-changes.outputs.changed == 'true' }}
        run: supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor,inbucket

      - name: Replay every migration against an empty local database
        if: ${{ steps.migration-changes.outputs.changed == 'true' }}
        run: supabase db reset --local

      - name: Run local agent control-plane SQL security tests
        if: ${{ steps.migration-changes.outputs.changed == 'true' }}
        run: supabase test db --local

      - name: Run local-discovery RLS through PostgREST
        if: ${{ steps.migration-changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status --output env)"
          SUPABASE_URL="$API_URL" \
            SUPABASE_DB_URL="$DB_URL" \
            SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_JWT_SECRET="$JWT_SECRET" \
            bun scripts/test-local-discovery-postgrest.mjs

      - name: Lint local database functions
        if: ${{ steps.migration-changes.outputs.changed == 'true' }}
        run: supabase db lint --local --fail-on error

      - name: Stop isolated local Supabase stack
        if: ${{ always() && steps.migration-changes.outputs.changed == 'true' }}
        run: supabase stop --no-backup


      - name: Set up k6 for load-test script validation
        if: ${{ hashFiles('tests/load/staging-public-read.js') != '' }}
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: "2.3.0"

      - name: Parse k6 script without sending traffic
        if: ${{ hashFiles('tests/load/staging-public-read.js') != '' }}
        run: k6 inspect --execution-requirements tests/load/staging-public-read.js

      - name: Enforce required dependency audit gate
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.dependency-audit.outcome }}
        run: |
          set -euo pipefail
          if [[ "$AUDIT_OUTCOME" != "success" ]]; then
            echo "::error::Locked dependency audit did not pass. Required verify remains blocked even if the other validation steps passed."
            exit 1
          fi
