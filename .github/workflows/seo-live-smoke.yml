name: Public SEO Smoke

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-seo-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify published SEO endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Probe published origin
        run: bun scripts/seo-live-smoke.ts
