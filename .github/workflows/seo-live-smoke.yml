name: Public SEO Smoke

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-seo-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify published SEO endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Probe published origin
        env:
          # Optional repository variable for the owner-confirmed canonical HTTPS origin.
          # Empty/unset keeps the script's conservative default; this does not publish or deploy.
          SEO_SMOKE_ORIGIN: ${{ vars.SEO_SMOKE_ORIGIN }}
        run: bun scripts/seo-live-smoke.ts
